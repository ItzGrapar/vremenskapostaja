<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Vremenska Postaja</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 5px;
        }

        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 900px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 15px;
            text-align: center;
            flex: 1;
            min-width: 280px;
            max-width: 400px;
        }

        /* Iframe okna, prilagojena, da se zlijejo s kartico */
        iframe {
            border: none;
            width: 100%;
            height: 250px;
            border-radius: 12px;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌤️ Moja ESP32 Vremenska Postaja</h1>
        <p>Trenutni podatki brez varnostnih blokad brskalnika</p>
    </header>

    <div class="dashboard">

        <!-- KARTICA ZA TEMPERATURO -->
        <div class="card">
            <iframe src="https://indigextra.com°C&min=0&max=50&color=red"></iframe>
        </div>

        <!-- KARTICA ZA VLAGO -->
        <div class="card">
            <iframe src="https://indigextra.com"></iframe>
        </div>

    </div>

    <footer>
        <p>Poganja ESP32 & GitHub Pages</p>
    </footer>

</body>
</html>
