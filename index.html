<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Vremenska Postaja</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #0056b3; margin-bottom: 5px; }
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            text-align: center;
            flex: 1;
            min-width: 250px;
            border-top: 5px solid #ff4757;
        }
        .card.hum { border-top-color: #0056b3; }
        .value { font-size: 3.5rem; font-weight: bold; color: #2f3542; margin: 10px 0; }
        .status { font-size: 0.85rem; color: #a4b0be; }
    </style>
</head>
<body>

    <header>
        <h1>🌤️ Moja ESP32 Vremenska Postaja</h1>
        <p>Podatki iz senzorjev osveženi v živo</p>
    </header>

    <div class="dashboard">
        <!-- Temperatura -->
        <div class="card">
            <h2>Temperatura</h2>
            <div class="value" id="temp-value">-- °C</div>
            <div class="status" id="temp-time">Nalaganje...</div>
        </div>

        <!-- Vlaga -->
        <div class="card hum">
            <h2>Vlažnost Zraka</h2>
            <div class="value" id="hum-value">-- %</div>
            <div class="status" id="hum-time">Nalaganje...</div>
        </div>
    </div>

    <script>
        function obdelajPodatke(podatki) {
            try {
                if (podatki && podatki.feeds && podatki.feeds.length > 0) {
                    const zadnjiVpis = podatki.feeds[0];
                    
                    const temp = parseFloat(zadnjiVpis.field1).toFixed(1);
                    const hum = parseFloat(zadnjiVpis.field2).toFixed(1);
                    
                    const čas = new Date(zadnjiVpis.created_at).toLocaleTimeString('sl-SI', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    document.getElementById('temp-value').innerText = temp !== "NaN" ? `${temp} °C` : "-- °C";
                    document.getElementById('temp-time').innerText = `Posodobljeno ob ${čas}`;
                    
                    document.getElementById('hum-value').innerText = hum !== "NaN" ? `${hum} %` : "-- %";
                    document.getElementById('hum-time').innerText = `Posodobljeno ob ${čas}`;
                }
            } catch (error) {
                console.error(error);
            }
        }

        function naložiVreme() {
            const staro = document.getElementById('ts-skripta');
            if (staro) staro.remove();

            const s = document.createElement('script');
            s.id = 'ts-skripta';
            // TUKAJ JE ZDAJ TVOJ PRAVI READ API KLJUČ!
            s.src = "https://thingspeak.com" + new Date().getTime();
            document.body.appendChild(s);
        }

        naložiVreme();
        setInterval(naložiVreme, 30000); // Osvežuje na 30 sekund
    </script>

</body>
</html>
