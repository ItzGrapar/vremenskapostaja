<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Vremenska Postaja</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #0056b3; margin-bottom: 5px; }
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px;
            flex: 1;
            min-width: 300px;
            max-width: 480px;
            text-align: center;
        }
        iframe {
            border: none;
            border-radius: 8px;
            width: 100%;
            height: 260px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌤️ Moja ESP32 Vremenska Postaja</h1>
        <p>Grafi se osvežujejo samodejno</p>
    </header>

    <div class="dashboard">

        <!-- Graf za Temperaturo (Field 1) -->
        <div class="card">
            <h2>Temperatura (°C)</h2>
            <iframe src="https://thingspeak.com"></iframe>
        </div>

        <!-- Graf za Vlago (Field 2) -->
        <div class="card">
            <h2>Vlažnost zraka (%)</h2>
            <iframe src="https://thingspeak.com"></iframe>
        </div>

    </div>

</body>
</html>
