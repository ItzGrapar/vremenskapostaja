<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Test Povezave</title>
</head>
<body>

    <h2>Test branja podatkov:</h2>
    <div id="izpis" style="font-size: 24px; font-weight: bold; color: blue;">Nalaganje podatkov...</div>

    <script>
        // Najbolj enostaven klic na ThingSpeak
        const url = "https://thingspeak.com";

        fetch(url)
            .then(odgovor => odgovor.json())
            .then(podatki => {
                // Če dobimo podatke, jih enostavno izpišemo na zaslon
                document.getElementById('izpis').innerHTML = 
                    "SREČA! Povezava dela.<br><br>" +
                    "Field 1 (Temperatura): " + podatki.field1 + "<br>" +
                    "Field 2 (Vlaga): " + podatki.field2;
            })
            .catch(napaka => {
                // Če se ponesreči, nam javi natančen razlog
                document.getElementById('izpis').style.color = "red";
                document.getElementById('izpis').innerHTML = "Napaka: Brskalnik ne more prebrati podatkov. Razlog: " + napaka;
            });
    </script>

</body>
</html>
