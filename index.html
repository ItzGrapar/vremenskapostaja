<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Vremenska Postaja</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header { text-align: center; margin-bottom: 30px; }
        h1 { color: #0056b3; margin-bottom: 5px; }
        .dashboard {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            max-width: 800px;
            width: 100%;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 25px;
            text-align: center;
            flex: 1;
            min-width: 250px;
            border-top: 5px solid #ff4757;
        }
        .card.hum { border-top-color: #2ed573; }
        .value { font-size: 3.5rem; font-weight: bold; color: #2f3542; margin: 10px 0; }
        .status { font-size: 0.85rem; color: #a4b0be; }
    </style>
</head>
<body>

    <header>
        <h1>🌤️ Moja ESP32 Vremenska Postaja</h1>
        <p>Uradno delujoče branje podatkov brez blokad brskalnika</p>
    </header>

    <div class="dashboard">
        <!-- Temperatura -->
        <div class="card">
            <h2>Temperatura</h2>
            <div class="value" id="temp-value">-- °C</div>
            <div class="status" id="temp-time">Nalaganje...</div>
        </div>

        <!-- Vlaga -->
        <div class="card hum">
            <h2>Vlažnost Zraka</h2>
            <div class="value" id="hum-value">-- %</div>
            <div class="status" id="hum-time">Nalaganje...</div>
        </div>
    </div>

    <!-- TUKAJ JE ZVIJAČA: JSONP klic, ki ga brskalnik NE more blokirati -->
    <script>
        // Ta funkcija se zažene takoj, ko ThingSpeak vrne podatke
        function obdelajPodatke(odgovor) {
            try {
                // Preberemo zadnji vpis
                const zadnjiVpis = odgovor.feeds[0];
                
                if (zadnjiVpis) {
                    const temp = parseFloat(zadnjiVpis.field1).toFixed(1);
                    const hum = parseFloat(zadnjiVpis.field2).toFixed(1);
                    
                    // Lep izpis časa
                    const čas = new Date(zadnjiVpis.created_at).toLocaleTimeString('sl-SI', {
                        hour: '2-digit',
                        minute: '2-digit'
                    });

                    // Izpis v kvadratke
                    document.getElementById('temp-value').innerText = `${temp} °C`;
                    document.getElementById('temp-time').innerText = `Osveženo ob ${čas}`;
                    
                    document.getElementById('hum-value').innerText = `${hum} %`;
                    document.getElementById('hum-time').innerText = `Osveženo ob ${čas}`;
                }
            } catch (napaka) {
                console.error("Napaka pri branju:", napaka);
            }
        }

        // Ustvarimo dinamično skripto, ki zaobide CORS blokado brskalnika
        function naložiIzThingSpeak() {
            const staro = document.getElementById('thingspeak-skripta');
            if (staro) staro.remove(); // Pobrišemo staro skripto pred osvežitvijo

            const skripta = document.createElement('script');
            skripta.id = 'thingspeak-skripta';
            // Povezava vsebuje tvoj ID, tvoj API ključ in dodatek &callback=obdelajPodatke
            skripta.src = "https://thingspeak.com";
            document.body.appendChild(skripta);
        }

        // Zaženemo branje takoj
        naložiIzThingSpeak();

        // Samodejno osvežujemo vsakih 30 sekund
        setInterval(naložiIzThingSpeak, 30000);
    </script>

</body>
</html>
