<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moja Vremenska Postaja</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: #0056b3;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        /* Glavni zabojnik za kartice */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 15px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card h2 {
            font-size: 1.2rem;
            color: #444;
            margin-top: 0;
            margin-bottom: 15px;
        }

        iframe {
            border: none;
            border-radius: 8px;
            width: 100%;
        }

        /* Višina za grafe */
        .iframe-chart {
            height: 260px;
        }

        /* Višina za ThingSpeak številčnice (Gauge) */
        .iframe-gauge {
            height: 220px;
        }

        footer {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌤️ Moja ESP32 Vremenska Postaja</h1>
        <p class="subtitle">Podatki iz senzorjev v živo</p>
    </header>

    <div class="dashboard">

        <!-- 1. TRENUTNA TEMPERATURA (Številčnica) -->
        <div class="card">
            <h2>Trenutna Temperatura</h2>
            <iframe class="iframe-gauge" src="https://thingspeak.com"></iframe>
        </div>

        <!-- 2. TRENUTNA VLAGA (Številčnica) -->
        <div class="card">
            <h2>Trenutna Vlažnost</h2>
            <iframe class="iframe-gauge" src="https://thingspeak.com"></iframe>
        </div>

        <!-- 3. GRAF TEMPERATURE (Zgodovina) -->
        <div class="card">
            <h2>Zgodovina Temperature (°C)</h2>
            <iframe class="iframe-chart" src="https://thingspeak.com"></iframe>
        </div>

        <!-- 4. GRAF VLAGE (Zgodovina) -->
        <div class="card">
            <h2>Zgodovina Vlažnosti (%)</h2>
            <iframe class="iframe-chart" src="https://thingspeak.com"></iframe>
        </div>

    </div>

    <footer>
        <p>Poganja ESP32, ThingSpeak in GitHub Pages</p>
    </footer>

</body>
</html>
