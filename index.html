<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Enostavno Branje</title>
</head>
<body>

    <h1>Zadnja vrednost (Field 1):</h1>
    <!-- Tukaj se bo izpisala številka -->
    <h2 id="podatek">Nalaganje...</h2>

    <script>
        // FUNKCIJA, KI PREJME PODATKE IN JIH IZPIŠE Na ZASLON
        function prikaziPodatek(odgovor) {
            if (odgovor && odgovor.feeds && odgovor.feeds.length > 0) {
                // Vzamemo vrednost iz Field 1
                var vrednost = odgovor.feeds[0].field1;
                // Prilepimo jo na zaslon namesto napisa "Nalaganje..."
                document.getElementById('podatek').innerText = vrednost + " (osveženo)";
            } else {
                document.getElementById('podatek').innerText = "Ni podatkov.";
            }
        }

        // KORAK ZA USTVARJANJE POVEZAVE (Zamenjaj podatke spodaj!)
        var channelID = "3468145"; 
        var readKey = "7GYV1F84N3AJHMRJ";

        // Trik s callback funkcijami, ki ga brskalnik ne more blokirati
        var skripta = document.createElement('script');
        skripta.src = "https://thingspeak.com" + channelID + "/feeds.json?api_key=" + readKey + "&results=1&callback=prikaziPodatek";
        document.body.appendChild(skripta);
    </script>

</body>
</html>
